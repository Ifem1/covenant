name: Batch 2A GenLayer runtime

on:
  push:
    branches:
      - codex/contract-foundation-hardening
  workflow_dispatch:
    inputs:
      ref:
        description: Exact hardening branch or commit to test
        required: true
        default: codex/contract-foundation-hardening

jobs:
  direct-mode-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Direct Mode tooling
        run: python -m pip install --upgrade pip 'genlayer-test==0.29.2' genvm-linter cloudpickle
      - name: Print Direct Mode versions
        run: python -c "import importlib.metadata as m; print(m.version('genlayer-test')); print(m.version('genlayer-py'))"
      - name: Prepare pinned GenVM runner cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location \
            https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz" | sha256sum -c -
      - name: GenVM Registry lint
        run: genvm-lint check contracts/covenant_registry.py
      - name: GenVM Registry schema
        run: genvm-lint schema contracts/covenant_registry.py
      - name: GenVM Vault lint
        run: genvm-lint check contracts/covenant_vault.py
      - name: GenVM Vault schema
        run: genvm-lint schema contracts/covenant_vault.py
      - name: Direct Mode probe suite
        run: gltest tests/test_direct_validator.py --contracts-dir contracts --leader-only
      - name: Direct Mode Registry suite
        if: always()
        run: gltest tests/test_direct_registry.py --contracts-dir contracts --leader-only
      - name: Direct Mode Vault suite
        if: always()
        run: gltest tests/test_direct_vault.py --contracts-dir contracts --leader-only
      - name: Deterministic regression suite
        if: always()
        run: pytest -q tests/test_direct_regressions.py
      - name: Direct Mode lifecycle suite
        if: always()
        run: gltest tests/test_direct_lifecycle.py --contracts-dir contracts --leader-only
      - name: Direct Mode evidence suite
        if: always()
        run: gltest tests/test_direct_evidence.py --contracts-dir contracts --leader-only
      - name: Direct Mode public audit suite
        if: always()
        run: gltest tests/test_direct_audit.py --contracts-dir contracts
      - name: Direct Mode financial suite
        if: always()
        run: gltest tests/test_direct_financial.py --contracts-dir contracts --leader-only

  glsim-contract-runtime:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout exact hardening ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GenLayer runtime tooling
        run: |
          python -m pip install --upgrade pip 'genlayer-test[sim]==0.30.0rc2' genvm-linter
          python -c "import importlib.metadata as m; print(m.version('genlayer-test')); print(m.version('genlayer-py'))"

      - name: Install npm dependencies
        run: npm ci


      - name: GenVM Registry lint
        run: genvm-lint check contracts/covenant_registry.py

      - name: GenVM Registry schema
        run: genvm-lint schema contracts/covenant_registry.py

      - name: GenVM Vault lint
        run: genvm-lint check contracts/covenant_vault.py

      - name: GenVM Vault schema
        run: genvm-lint schema contracts/covenant_vault.py

      - name: Start deterministic GLSim
        shell: bash
        run: |
          set -o pipefail
          glsim --chain-id 61999 --validators 5 --seed batch2a --no-browser 2>&1 | tee glsim.log &
          echo $! > glsim.pid
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error -X POST http://127.0.0.1:4000/api \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat glsim.log
          exit 1

      - name: Run Batch 2A contract runtime harness
        run: node scripts/test-glsim-contracts.mjs

      - name: Publish GLSim log
        if: always()
        run: test ! -f glsim.log || cat glsim.log
